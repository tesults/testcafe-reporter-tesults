name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node.js ${{ matrix.node-version }}, TestCafe ${{ matrix.testcafe-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: "20"
            testcafe-version: "1.20.1"
          - node-version: "20"
            testcafe-version: "3.7.6"
          - node-version: "24"
            testcafe-version: "3.7.6"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Select TestCafe version
        run: npm install --no-save testcafe@${{ matrix.testcafe-version }}

      - name: Run unit tests
        run: npm test

      - name: Install the packed reporter into the integration project
        run: |
          reporter_version=$(node -p "require('./package.json').version")
          npm pack --pack-destination "${{ runner.temp }}"
          npm install --prefix test/integration --no-package-lock --no-save "testcafe@${{ matrix.testcafe-version }}" "${{ runner.temp }}/testcafe-reporter-tesults-${reporter_version}.tgz"

      - name: Run passing and skipped TestCafe tests
        env:
          TESULTS_OUTPUT_FILE: ${{ runner.temp }}/testcafe-passing/results.json
        run: |
          test/integration/node_modules/.bin/testcafe chrome:headless test/integration/passing.js --reporter spec,tesults --screenshots ${{ runner.temp }}/screenshots
          node test/integration/validate-output.js "$TESULTS_OUTPUT_FILE" passing

      - name: Run failing TestCafe test
        env:
          TESULTS_OUTPUT_FILE: ${{ runner.temp }}/testcafe-failing/results.json
        shell: bash
        run: |
          set +e
          test/integration/node_modules/.bin/testcafe chrome:headless test/integration/failing.js --reporter spec,tesults
          test_status=$?
          set -e
          if [[ "$test_status" -eq 0 ]]; then
            echo "Expected the TestCafe run to fail"
            exit 1
          fi
          node test/integration/validate-output.js "$TESULTS_OUTPUT_FILE" failing
